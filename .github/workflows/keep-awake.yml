name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 */4 * * *' # يعمل تلقائياً كل 4 ساعات
  workflow_dispatch: # يتيح لك تشغيله يدوياً

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pinging Database
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
